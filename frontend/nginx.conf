server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every page is a real static file (multi-page vanilla app, not an SPA),
    # so no catch-all rewrite is needed — a missing page should 404 normally.
    location / {
        try_files $uri $uri/ =404;
    }

    location /css/ { add_header Cache-Control "no-cache"; }
    location /js/  { add_header Cache-Control "no-cache"; }

    gzip on;
    gzip_types text/css application/javascript text/html application/json;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
